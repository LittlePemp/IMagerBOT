server {
    listen 8080;
    server_name _;
    server_tokens off;

    auth_basic "IMager Temporal";
    auth_basic_user_file /run/secrets/temporal_ui_htpasswd;

    location = /healthz {
        auth_basic off;
        access_log off;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://temporal:8233;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The UI itself has no local username/password provider. Do not pass
        # the proxy's BasicAuth credentials to its upstream HTTP/gRPC bridge.
        proxy_set_header Authorization "";
        proxy_read_timeout 300s;
    }
}
