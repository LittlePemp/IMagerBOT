# Scoped reverse-proxy workarounds for the pinned Community MinIO release.
# See infra/PRODUCTION.md: this does not patch the affected server binary.
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx-minio.pid;

events {
    worker_connections 256;
}

http {
    # Do not log query-string credentials, signatures or security tokens.
    log_format minio_gateway '$remote_addr "$request_method $uri $server_protocol" '
                             '$status $body_bytes_sent';
    access_log /dev/stdout minio_gateway;
    server_tokens off;
    proxy_headers_hash_bucket_size 128;

    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream minio_storage {
        zone minio_storage 64k;
        server minio-storage:9000 resolve;
        keepalive 16;
    }

    # Reject even a duplicated/comma-joined value; normal hashes and the signed
    # streaming variants remain unchanged. Header names are case insensitive.
    map $http_x_amz_content_sha256 $minio_unsigned_trailer {
        default 0;
        ~*STREAMING-UNSIGNED-PAYLOAD-TRAILER 1;
    }

    # Query names are not URI-decoded by nginx's $args. Accept both literal
    # characters and one percent-encoding pass, including encoded upper case,
    # as Go's URL.Query does. Neither argument order nor repeated keys matter.
    map $args $minio_select_argument {
        default 0;
        "~*(^|&)(s|%[57]3)(e|%[46]5)(l|%[46]c)(e|%[46]5)(c|%[46]3)(t|%[57]4)((-|%2d)(t|%[57]4)(y|%[57]9)(p|%[57]0)(e|%[46]5))?(=|&|$)" 1;
    }
    map "$request_method:$minio_select_argument" $minio_select_request {
        default 0;
        "POST:1" 1;
    }

    # extractMetadataFromReq also accepts metadata from the query/form, so
    # stripping the six known request headers alone would leave another path.
    map $args $minio_replication_argument {
        default 0;
        "~*(^|&)(x|%[57]8)(-|%2d)(m|%[46]d)(i|%[46]9)(n|%[46]e)(i|%[46]9)(o|%[46]f)(-|%2d)(r|%[57]2)(e|%[46]5)(p|%[57]0)(l|%[46]c)(i|%[46]9)(c|%[46]3)(a|%[46]1)(t|%[57]4)(i|%[46]9)(o|%[46]f)(n|%[46]e)(-|%2d)" 1;
    }
    map $http_content_type $minio_form_body {
        default 0;
        "~*(^|,)[ \t]*(multipart/form-data|application/x-www-form-urlencoded)([ \t;,]|$)" 1;
    }

    server {
        listen 9000;
        client_max_body_size 0;
        client_header_timeout 10s;
        client_body_timeout 60s;

        if ($minio_unsigned_trailer) { return 403; }
        if ($minio_select_request) { return 403; }
        if ($minio_replication_argument) { return 403; }
        if ($minio_form_body) { return 403; }

        location / {
            # Preserve the original URI, query and Host (including its port):
            # MinIO's SDK signs all of these. No body buffering or disk spool.
            proxy_pass http://minio_storage;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_next_upstream off;
            proxy_connect_timeout 10s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;

            # These are all replicationToInternalHeaders in the pinned source.
            # Replication/SSE-C replication are not part of IMager's workload.
            proxy_set_header X-Minio-Replication-Server-Side-Encryption-Sealed-Key "";
            proxy_set_header X-Minio-Replication-Server-Side-Encryption-Seal-Algorithm "";
            proxy_set_header X-Minio-Replication-Server-Side-Encryption-Iv "";
            proxy_set_header X-Minio-Replication-Encrypted-Multipart "";
            proxy_set_header X-Minio-Replication-Actual-Object-Size "";
            proxy_set_header X-Minio-Replication-Ssec-Crc "";
        }
    }
}
