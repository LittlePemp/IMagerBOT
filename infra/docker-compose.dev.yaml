name: imager-temporal

x-logging: &logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

x-core-environment: &core-environment
  MONGODB_URI: mongodb://imager:${MONGO_PASSWORD:?Run infra/setup.py}@mongodb:27017/?authSource=admin
  IMAGER_CONFIG_FILE: /app/config/runtime.toml
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Run infra/setup.py}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Run infra/setup.py}

x-config-volume: &config-volume
  type: bind
  source: ${IMAGER_CONFIG_SOURCE:?Run infra/setup.py}
  target: /app/config/runtime.toml
  read_only: true

x-core: &core
  image: imager-temporal/core:local
  build:
    context: ..
    dockerfile: imager/Dockerfile
  environment: *core-environment
  volumes:
    - *config-volume
  restart: unless-stopped
  logging: *logging
  init: true
  stop_grace_period: 60s
  depends_on:
    mongodb:
      condition: service_healthy
    temporal:
      condition: service_healthy
    minio-gateway:
      condition: service_healthy

services:
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    logging: *logging
    environment:
      MONGO_INITDB_ROOT_USERNAME: imager
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Run infra/setup.py}
    volumes:
      - type: bind
        source: ${IMAGER_MONGO_DATA_PATH:?Run infra/setup.py}
        target: /data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 30

  minio:
    image: imager-temporal/minio:2025-10-15
    build:
      context: ..
      dockerfile: infra/minio.Dockerfile
    restart: unless-stopped
    logging: *logging
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Run infra/setup.py}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Run infra/setup.py}
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - type: bind
        source: ${IMAGER_MINIO_DATA_PATH:?Run infra/setup.py}
        target: /data
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORT:?Run infra/setup.py}:9001"
    # Storage is reachable only by the gateway; the console remains host-local.
    networks:
      minio-backend:
        aliases:
          - minio-storage
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 60

  minio-gateway:
    image: nginx:1.28.2-alpine
    restart: unless-stopped
    logging: *logging
    mem_limit: 64000000
    volumes:
      - ./nginx/minio-gateway.conf:/etc/nginx/nginx.conf:ro
    networks:
      default:
        aliases:
          - minio
      minio-backend: {}
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 30

  temporal:
    image: temporalio/temporal:1.10.0
    # Local dev server only. Root is used for writable project bind storage;
    # a production Temporal deployment uses its supported persistence backend.
    user: "0:0"
    restart: unless-stopped
    logging: *logging
    command:
      - server
      - start-dev
      - --ip
      - 0.0.0.0
      - --namespace
      - ${IMAGER_TEMPORAL_NAMESPACE:?Run infra/setup.py}
      - --db-filename
      - /data/temporal.db
    volumes:
      - type: bind
        source: ${IMAGER_TEMPORAL_DATA_PATH:?Run infra/setup.py}
        target: /data
    # No host UI/gRPC ports: UI is reachable only through authenticated nginx.
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 5s
      timeout: 5s
      retries: 60

  temporal-ui:
    image: nginx:1.28.2-alpine
    restart: unless-stopped
    logging: *logging
    depends_on:
      temporal:
        condition: service_healthy
    ports:
      - "127.0.0.1:${TEMPORAL_UI_PORT:?Run infra/setup.py}:8080"
    volumes:
      - ./nginx/temporal-ui.conf:/etc/nginx/conf.d/default.conf:ro
    secrets:
      - temporal_ui_htpasswd
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

  imager-dispatcher:
    <<: *core
    command: ["python", "-m", "src.presentation.temporal.dispatcher"]
    mem_limit: 256000000

  imager-worker:
    <<: *core
    command: ["python", "-m", "src.presentation.temporal.worker"]
    # One container = one Activity slot = one active image. No container_name,
    # so --scale imager-worker=2 creates another independently bounded worker.
    mem_limit: 1000000000
    volumes:
      - *config-volume
      # Only unique TemporaryDirectory attempt scratch, never persistent image
      # references. Files are removed on normal completion; no shared-path API.
      - type: bind
        source: ${IMAGER_WORKER_SCRATCH_PATH:?Run infra/setup.py}
        target: /tmp

  catalog-import-worker:
    <<: *core
    command: ["python", "-m", "src.presentation.temporal.import_worker"]
    # Import work has its own Temporal queue, process and resource budget.
    # Rendering keeps its existing single slot even during a ZIP import.
    mem_limit: 1000000000
    environment:
      <<: *core-environment
      TMPDIR: /tmp
    volumes:
      - *config-volume
      - type: bind
        source: ${IMAGER_IMPORT_SCRATCH_PATH:?Run infra/setup.py}
        target: /tmp

  telegram-bot-api:
    profiles: ["bot"]
    image: aiogram/telegram-bot-api@sha256:ba7493f853b3c3339e6dc2a444d5bcfbe121188b491aabd30857dcd69978430c
    restart: unless-stopped
    logging: *logging
    init: true
    mem_limit: 256000000
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_WORK_DIR: /var/lib/telegram-bot-api
      TELEGRAM_TEMP_DIR: /tmp/telegram-bot-api
      TELEGRAM_LOCAL: '1'
      TELEGRAM_HTTP_PORT: '8081'
    entrypoint: ["/bin/sh", "/scripts/start.sh"]
    volumes:
      - ./telegram-bot-api/start.sh:/scripts/start.sh:ro
      - type: bind
        source: ${IMAGER_BOT_API_DATA_PATH:?Run infra/setup.py}
        target: /var/lib/telegram-bot-api
      - type: bind
        source: ${IMAGER_BOT_API_TEMP_PATH:?Run infra/setup.py}
        target: /tmp/telegram-bot-api
    healthcheck:
      test: ["CMD", "nc", "-z", "-w", "2", "127.0.0.1", "8081"]
      interval: 5s
      timeout: 3s
      retries: 30

  telegram-bot:
    profiles: ["bot"]
    image: imager-temporal/bot:local
    build:
      context: ..
      dockerfile: telegram_bot/Dockerfile
    restart: unless-stopped
    logging: *logging
    init: true
    environment:
      API_TOKEN: ${API_TOKEN:-}
      SUPPORT_BOT_TOKEN: ${SUPPORT_BOT_TOKEN:-}
      TELEGRAM_ADMIN_IDS: ${TELEGRAM_ADMIN_IDS:-}
      TELEGRAM_API_BASE_URL: http://telegram-bot-api:8081
      TELEGRAM_API_LOCAL: 'true'
      MONGODB_URI: mongodb://imager:${MONGO_PASSWORD:?Run infra/setup.py}@mongodb:27017/?authSource=admin
      IMAGER_CONFIG_FILE: /app/config/runtime.toml
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Run infra/setup.py}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Run infra/setup.py}
      TMPDIR: /tmp
    volumes:
      - *config-volume
      - type: bind
        source: ${IMAGER_BOT_SCRATCH_PATH:?Run infra/setup.py}
        target: /tmp
      # Only the Telegram transport shares this read-only local-file cache.
      # Core import/render workers receive MinIO references, never these paths.
      - type: bind
        source: ${IMAGER_BOT_API_DATA_PATH:?Run infra/setup.py}
        target: /var/lib/telegram-bot-api
        read_only: true
    depends_on:
      telegram-bot-api:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      minio-gateway:
        condition: service_healthy

  import-catalog:
    <<: *core
    profiles: ["tools"]
    restart: "no"
    command: ["python", "-m", "src.presentation.cli.catalog_cli", "/imports"]
    volumes:
      - *config-volume
      - ${IMAGER_IMPORT_ROOT:?Run infra/setup.py}:/imports:ro

networks:
  default: {}
  minio-backend:
    internal: true

secrets:
  temporal_ui_htpasswd:
    file: ${IMAGER_TEMPORAL_UI_AUTH_FILE:?Run infra/setup.py}
